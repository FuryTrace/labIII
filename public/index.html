<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela auxiliar</title>
    <link href="/css/bootstrap.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container py-5 mb-4">
        <h1>Tela de configuração e de testes</h1>
      
        <br>
        <h3>Configuração do Usuário</h2>

        <div class="row align-items-end">

            <div class="col-md-4">
                <label for="cmbUsuario" class="form-label">Escolha um usuário:</label>
                <select class ="form-select" name="cmbUsuario" id="cmbUsuario">
                </select>
            </div>
            <div class="col-md-2">
                <!-- <button onclick="salvarConfiguracao()" class="btn btn-primary w-100"></button>Salvar a configuração</button> -->
                  <button id="btnSalvarConfiguracao"  onclick="salvarConfiguracao()" class="btn btn-primary w-100">Salva a configuração</button>
            </div>
        </div>
        <br>
        
        <h3>Teste das Telas de Cupom e de Voucher</h3>
        <p>
            <a href="cupom.html" class="btn btn-primary col-md-3"">Tela de Cupom</a>
        </p>
        <p>
            <a href="voucher.html" class="btn btn-primary col-md-3"">Tela de Voucher</a>
        </p>
 
        <br>
         <h2>
                Teste dos Serviços Validação e Utilização de Descontos
        </h2>
        <div class="row mb-5 align-items-end">
           
            <div class="col-md-3">
                <label for="inputCupomVoucher" class="form-label">Código</label>
                <input type="text" class="form-control" id="inputCupomVoucher" placeholder="Cupom ou Voucher">
            </div>
            <div class="col-md-2">
                <button id="btnValidarDesconto"  onclick="validarDesconto()" class="btn btn-primary w-100">Validar</button>
            </div>
        </div>
        <div class="row mb-5">
            <div class="col-md-3">
                <label for="inputIdDesconto" class="form-label">Código</label>
                <input type="text" class="form-control" id="inputIdDesconto" placeholder="ID do Cupom ou Voucher">
            </div>

            <div class="col-md-3">
                <label for="inputPedido" class="form-label">Pedido</label>
                <input type="text" class="form-control" id="inputPedido">
            </div>
            <div class="col-md-3">
                <label for="inputValor" class="form-label">Valor</label>
                <input type="text" class="form-control" id="inputValor">
            </div>
            <div class="col-md-3 align-self-end">
                <button id="btnUtilizarDesconto"  onclick="utilizarDesconto()" class="btn btn-primary w-100">Utilizar</button>
            </div>


        </div>
        <div class="col-md-12 mb-5">
            <label for="areaResposta" class="form-form-label">Resposta</label>
            <textarea class="form-control" id="areaResposta" rows="8" placeholder="Resultado..."></textarea>
        </div>

    </div>


             
    <script src="js/bootstrap.js" type="text/javascript"></script>
    <script src="js/configuracao.js" type="text/javascript"></script>

</body>
</html>
